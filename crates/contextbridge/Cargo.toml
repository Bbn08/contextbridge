[package]
name = "contextbridge"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "=1.5.10", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-dynamodb = "=1.54.0"
aws-sdk-s3 = "=1.54.0"
async-trait = "0.1"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "tls-rustls"] }
thiserror = "2"
tiktoken-rs = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"

[features]
aws-tests = []
